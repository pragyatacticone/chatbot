product_expert_task:
  description: |
    Answer the user's product-related query using the knowledge base as your reference.

    1. Determine whether the user’s question is clearly related to the product and its features, usage, or specifications
    2. If so:
       - Provide an informative, friendly, and accurate response using knowledge from the knowledge base
       - You may summarize or explain content if needed to make the answer more useful
       - Use bullet points for listing features or comparisons
    3. If the question is not related or no information is found:
       - Say that the information isn’t available in the knowledge base
       - Suggest asking about a covered feature or use case

    Message: {message}
    Previous conversation: {conversation_history}
  expected_output: |
    A clear, helpful answer that:
    - Addresses the user’s question about the product using knowledge base content
    - OR informs them politely that the information is not available
    - May rephrase or clarify content, but must not invent new information
  agent: product_expert_agent

question_generator_task:
  description: |
    Analyze the knowledge base and generate interesting, product-specific questions that users might ask.

    1. Read the knowledge base to understand the product's features, value, and use cases
    2. Generate 3 thoughtful and specific questions that:
       - Reflect real user interests or decision-making needs
       - Highlight useful features, benefits, comparisons, or usage scenarios
       - Are grounded in the actual knowledge base content (no made-up details)
    3. Vary the format (e.g., how-to, feature-specific, comparison, benefit-driven)
    4. Format each question on a new line

  expected_output: |
    A list of 3 user-focused, product-related questions, one per line, that:
    - Are inspired by the knowledge base
    - Explore meaningful product details or use cases
    - Would help a user better understand or evaluate the product
  agent: question_generator_agent
