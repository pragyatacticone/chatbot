product_expert_task:
  description: |
    Answer the user's question briefly using only the product knowledge base.

    1. Check if the question is about the product or its details
    2. If so, respond with:
       - A short, friendly explanation (2 or 3 sentences max)
       - Use plain language and highlight key points
    3. If the topic is not in the knowledge base:
       - Reply with: "That information isn't available in the knowledge base"

    Message: {message}
    Previous conversation: {conversation_history}
  expected_output: |
    A concise, clear answer using only the knowledge base, ideally no more than 2 or 3 sentences. If the answer is not covered, say so directly.
  agent: product_expert_agent

question_generator_task:
  description: |
    Based on the knowledge base, generate 3 short follow-up questions a user might ask next.

    1. Read the knowledge base for product details
    2. Generate 3 short, clear follow-up questions
       - Keep each question under 12 words
       - Use casual, helpful phrasing
    3. Questions must be relevant to the product and covered by the knowledge base
    4. Format each question on a new line

  expected_output: |
    A list of 3 short and relevant product-related questions, one per line. Each should be clear, helpful, and based entirely on the knowledge base.
  agent: question_generator_agent
